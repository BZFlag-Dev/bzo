<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no' />
    <title>XR Minimal Test</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 10;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 8px 10px;
        border-radius: 8px;
        font: 12px sans-serif;
      }
    </style>
  </head>
  <body>
    <div id='status'>Enter XR</div>
    <script type='module'>
      import * as THREE from '/vendor/three/three.module.js';

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x222222);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
      camera.position.set(0, 1.6, 3);
      scene.add(camera);

      const marker = new THREE.Mesh(
        new THREE.PlaneGeometry(0.25, 0.25),
        new THREE.MeshBasicMaterial({
          color: 0xff0000,
          side: THREE.DoubleSide,
          depthTest: false,
          depthWrite: false,
          transparent: true,
          opacity: 1,
        })
      );
      marker.position.set(0, 0, -0.5);
      marker.renderOrder = Number.MAX_SAFE_INTEGER;
      marker.visible = false;
      camera.add(marker);

      const ambient = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(ambient);

      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.2, 0.2),
        new THREE.MeshStandardMaterial({ color: 0x00ccff })
      );
      cube.position.set(0, 0, -2);
      scene.add(cube);

      function renderFrame() {
        marker.visible = renderer.xr.isPresenting;
        cube.rotation.y += 0.02;
        renderer.render(scene, camera);
      }

      renderer.setAnimationLoop(renderFrame);

      const xrButton = document.getElementById('status');
      let xrSession = null;
      xrButton.addEventListener('click', async () => {
        if (xrSession) {
          await xrSession.end();
          return;
        }

        const supported = await navigator.xr?.isSessionSupported?.('immersive-vr');
        if (!supported) {
          xrButton.textContent = 'XR not supported';
          return;
        }
        xrSession = await navigator.xr.requestSession('immersive-vr', {
          optionalFeatures: ['local-floor'],
        });
        xrSession.addEventListener('selectstart', () => {
          void xrSession?.end();
        }, { once: true });
        xrSession.addEventListener('end', () => {
          xrSession = null;
          marker.visible = false;
          xrButton.textContent = 'Enter XR';
        }, { once: true });
        await renderer.xr.setSession(xrSession);
        xrButton.textContent = 'Exit XR';
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
